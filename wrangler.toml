name = "radamantis"
main = "src/core/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# KV / D1 / R2 / Queues bindings compartidos por defecto (heredados salvo que
# un [env.X] los redefina). Crear con:
#   npx wrangler kv namespace create SESSIONS
# y pegar el "id" resultante aquí.
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = ""

# [[d1_databases]]
# binding = "DB"
# database_name = "radamantis-db"
# database_id = ""

# ============================================================================
# NEGOCIOS (un Worker por negocio, un [env.<slug>] por negocio).
# NO editar a mano entre las marcas BEGIN/END: se regenera con
#   node scripts/gen-wrangler-envs.mjs
# a partir de businesses/*.json. Los secrets (ANTHROPIC_API_KEY,
# WHATSAPP_ACCESS_TOKEN, etc.) NO van aquí — se cargan por negocio con
# `npx wrangler secret put <NOMBRE> --env <slug>` (ver docs/DEPLOY.md).
# ============================================================================
# BEGIN GENERATED ENVS
[env.ch-veterinarios]
name = "radamantis-ch-veterinarios"

[env.ch-veterinarios.vars]
ENVIRONMENT = "production"
BUSINESS_SLUG = "ch-veterinarios"
BUSINESS_DISPLAY_NAME = "CH Veterinarios"
BUSINESS_VERTICAL = "clinica"
VOICE_TONE = "calido"
SYSTEM_PROMPT_EXTRA = "Eres el asistente de una clínica veterinaria. Ayuda a agendar citas, resolver dudas generales sobre servicios y precios (si no los sabes con certeza, ofrece confirmarlos), y detecta urgencias (mascota herida, intoxicada, en labor de parto complicada) para escalar a un humano de inmediato."
LLM_DEFAULT_PROVIDER = "openai"
LLM_MONTHLY_BUDGET_USD = "20"
ADMIN_WHATSAPP_NUMBER = ""
WHATSAPP_PHONE_NUMBER_ID = ""
WHATSAPP_WEBHOOK_VERIFY_TOKEN = "radamantis-ch-veterinarios-verify"

# KV del negocio (sesiones + métricas). Sin provisionar todavía:
#   1) npx wrangler kv namespace create SESSIONS --env ch-veterinarios
#   2) copiar el "id" que imprime a businesses/ch-veterinarios.json -> "kvSessionsId"
#   3) node scripts/gen-wrangler-envs.mjs
# [[env.ch-veterinarios.kv_namespaces]]
# binding = "SESSIONS"
# id = ""

# Secrets (NO van en este archivo, cargar con wrangler secret put --env ch-veterinarios):
#   WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET, ANTHROPIC_API_KEY / OPENAI_API_KEY (según LLM_DEFAULT_PROVIDER)
# END GENERATED ENVS
